name: Nuitka Build from Python

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: '入口脚本文件名 (例如: main.py, app.py)'
        required: true
        default: 'main.py'
        type: string
      os_selector:
        description: '选择构建操作系统'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
      build_mode:
        description: 'Nuitka 构建模式'
        required: true
        default: 'onefile'
        type: choice
        options:
          - onefile
          - standalone

jobs:
  build:
    runs-on: ${{ github.event.inputs.os_selector }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        # 这里使用手动输入的 script_name
        script-name: ${{ github.event.inputs.script_name }}
        onefile: ${{ github.event.inputs.build_mode == 'onefile' }}
        standalone: ${{ github.event.inputs.build_mode == 'standalone' }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Build-${{ github.event.inputs.os_selector }}-${{ github.event.inputs.build_mode }}
        path: |
          build/*.exe
          build/*.bin
          build/main
          dist/*.exe
          dist/*.bin
          dist/main
